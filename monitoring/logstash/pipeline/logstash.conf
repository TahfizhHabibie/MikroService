input {
  beats {
    port => 5044
  }
}

filter {
  # Docker wraps our JSON log line inside the "message" field.
  # Our apps already log JSON (via logstash-logback-encoder), so decode it.
  if [message] {
    json {
      source => "message"
      target => "log"
      skip_on_invalid_json => true
    }
  }

  if [log][application] {
    mutate {
      add_field => { "service" => "%{[log][application]}" }
    }
  }

  if [log][level] {
    mutate {
      add_field => { "log_level" => "%{[log][level]}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "microservices-logs-%{+YYYY.MM.dd}"
  }
}
