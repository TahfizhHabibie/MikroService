networks:
  microservice-net:
    driver: bridge

volumes:
  mysql-data:
  esdata:
  grafana-data:

services:
  # ======================= INFRASTRUCTURE =======================
  mysql:
    restart: unless-stopped
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: auth_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - microservice-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-defs.conf:ro
    networks:
      - microservice-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ======================= DISCOVERY & GATEWAY =======================
  eureka:
    restart: unless-stopped
    build: ./eureka
    container_name: eureka
    ports:
      - "8761:8761"
    networks:
      - microservice-net

  gateway-service:
    restart: unless-stopped
    build: ./gateway-service
    container_name: gateway-service
    environment:
      EUREKA_HOST: eureka
      HOSTNAME: gateway-service
    ports:
      - "9000:9000"
    depends_on:
      - eureka
    networks:
      - microservice-net

  # ======================= BUSINESS SERVICES =======================
  authservice:
    restart: unless-stopped
    build: ./authservice
    container_name: authservice
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ""
    ports:
      - "8086:8086"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - microservice-net

  produk:
    restart: unless-stopped
    build: ./produk
    container_name: produk
    environment:
      EUREKA_HOST: eureka
    ports:
      - "8081:8081"
    depends_on:
      - eureka
    networks:
      - microservice-net

  pelanggan:
    restart: unless-stopped
    build: ./pelanggan
    container_name: pelanggan
    environment:
      EUREKA_HOST: eureka
    ports:
      - "8082:8082"
    depends_on:
      - eureka
    networks:
      - microservice-net

  order:
    restart: unless-stopped
    build: ./order
    container_name: order
    environment:
      EUREKA_HOST: eureka
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ari
      RABBITMQ_PASSWORD: "12345"
    ports:
      - "8083:8083"
    depends_on:
      eureka:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - microservice-net

  produser:
    restart: unless-stopped
    build: ./produser
    container_name: produser
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: habibi
      RABBITMQ_PASSWORD: "12345"
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservice-net

  consumer:
    restart: unless-stopped
    build: ./consumer
    container_name: consumer
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ari
      RABBITMQ_PASSWORD: "12345"
    ports:
      - "8085:8085"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservice-net

  # ======================= MONITORING: PROMETHEUS + GRAFANA =======================
  prometheus:
    restart: unless-stopped
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - microservice-net

  grafana:
    restart: unless-stopped
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - microservice-net

  # ======================= LOGGING: ELK STACK =======================
  elasticsearch:
    restart: unless-stopped
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    deploy:
      resources:
        limits:
          memory: 1.2g
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - microservice-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 10

  logstash:
    restart: unless-stopped
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: logstash
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    deploy:
      resources:
        limits:
          memory: 700m
    volumes:
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./monitoring/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    ports:
      - "5044:5044"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - microservice-net

  kibana:
    restart: unless-stopped
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - NODE_OPTIONS=--max-old-space-size=512
    deploy:
      resources:
        limits:
          memory: 900m
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - microservice-net

  filebeat:
    restart: unless-stopped
    image: docker.elastic.co/beats/filebeat:8.13.4
    container_name: filebeat
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        cp /usr/share/filebeat/filebeat.yml.src /usr/share/filebeat/filebeat.yml &&
        chown root:root /usr/share/filebeat/filebeat.yml &&
        chmod go-w /usr/share/filebeat/filebeat.yml &&
        /usr/local/bin/docker-entrypoint -e
    volumes:
      - ./monitoring/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml.src:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash
    networks:
      - microservice-net